name: Build Samples and Tests

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        config: [ Debug, Release ]
        platform: [ windows-latest, ubuntu-latest ]
    runs-on: ${{ matrix.platform }}
    steps:
    - uses: actions/checkout@v4

    - name: Install Linux dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt update
        sudo apt install -y \
          cmake \
          libgl1-mesa-dev \
          libglu1-mesa-dev \
          libx11-dev \
          libxext-dev \
          python3-jinja2
           
    - name: Configure Samples
      run: cmake -S samples -B build-samples -DCMAKE_BUILD_TYPE=${{ matrix.config }}

    - name: Install Samples Windows dependencies
      if: runner.os == 'Windows'
      run: cmake -P samples/install_python_requirements.cmake
        
    - name: Build Samples
      run: cmake --build build-samples --config ${{ matrix.config }}

    - name: Configure Tests
      run: cmake -S test -B build-tests -DCMAKE_BUILD_TYPE=${{ matrix.config }}

    - name: Build Tests
      run: cmake --build build-tests --config ${{ matrix.config }}

    - name: Run Tests
      run: ctest --test-dir build-tests --output-on-failure

    - uses: actions/cache@v4
      with:
        path: build-samples/_deps
        key: ${{ runner.os }}-${{ hashFiles('**/CMakeLists.txt') }}

    - uses: actions/cache@v4
      with:
        path: build-tests/_deps
        key: ${{ runner.os }}-${{ hashFiles('**/CMakeLists.txt') }}
