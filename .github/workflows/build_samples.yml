name: Build Samples

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        config: [ Debug, Release ]
        platform: [ windows-latest, ubuntu-latest ]
    runs-on: ${{ matrix.platform }}
    steps:
    - uses: actions/checkout@v4

    - name: Install Linux dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt update
        sudo apt install -y \
          cmake \
          libgl1-mesa-dev \
          libglu1-mesa-dev \
          libx11-dev \
          libxext-dev \
          python3-jinja2
          
           #xorg-dev
        
    - name: Configure
      run: cmake -S samples -B build-samples -DCMAKE_BUILD_TYPE=${{ matrix.config }}
        
    - name: Build
      run: cmake --build build-samples --config ${{ matrix.config }}

    - uses: actions/cache@v4
      with:
        path: build-samples/_deps
        key: ${{ runner.os }}-${{ hashFiles('**/CMakeLists.txt') }}
